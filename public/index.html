<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <span class="mark">TKB</span>
      <div>
        <h1 id="intro-title">Tra cứu thời khóa biểu</h1>
        <p>THPT Chuyên Lý Tự Trọng · Cần Thơ</p>
        <p>Áp dụng từ <span id="effective-date-value"></span></p>
      </div>
    </div>
  </header>
  <p class="pull-refresh" id="pull-refresh" aria-live="polite"></p>
  <p class="flash" id="flash"></p>
  <div class="controls">
    <div class="mode-filter">
      <select id="mode-select" aria-label="Chế độ xem">
        <option value="lop">Lớp</option>
        <option value="giao_vien">Giáo viên</option>
        <option value="ho_va_ten">Học sinh</option>
      </select>
      <div id="entity-control" aria-label="Giá trị lọc"></div>
    </div>
    <section class="view-controls" id="view-controls" aria-label="Kiểu hiển thị">
      <div class="view-switch">
        <button type="button" data-view="week" class="active">Xem cả tuần</button>
      </div>
      <div class="day-buttons" id="day-control">
        <div id="day-buttons" class="day-list" role="group" aria-label="Chọn ngày">
          <button type="button" data-day="Thứ 2">T2</button>
          <button type="button" data-day="Thứ 3">T3</button>
          <button type="button" data-day="Thứ 4">T4</button>
          <button type="button" data-day="Thứ 5">T5</button>
          <button type="button" data-day="Thứ 6">T6</button>
          <button type="button" data-day="Thứ 7">T7</button>
        </div>
      </div>
    </section>
  </div>

  <main>
    <div class="legend" id="legend"></div>
    <div class="board" id="board">
      <p class="empty">Vui lòng chọn lớp để xem thời khóa biểu.</p>
    </div>
  </main>

  <footer>
    <div class="top-actions">
      <label class="upload">
        <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden />
        <span>Nhập Excel</span>
      </label>
      <button id="reload" type="button" aria-label="Tải lại thời khóa biểu">Tải lại</button>
      <button id="print" type="button">In</button>
    </div>
    <span>Thời khóa biểu THPT Chuyên Lý Tự Trọng, Cần Thơ.</span>
    <span>Tạo cho Nguyễn Nam, lớp Chuyên Tin Khoá 37.</span>
    <a href="https://github.com/cusc-ntuan/TKB_LTT" target="_blank" rel="noopener noreferrer">Mã nguồn trên GitHub</a>
    <div class="footer-stats">
      <span class="views">Hôm nay: <b id="today-viewers">—</b> / Tổng: <b id="total-viewers">—</b></span>
      <span class="online"><i></i><b id="online-count">0</b> đang trực tuyến</span>
    </div>
  </footer>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    const effectiveDate = window.TKB_CONFIG?.effectiveDate || "";
    const effectiveDateValueEl = document.getElementById("effective-date-value");
    if (effectiveDateValueEl) {
      effectiveDateValueEl.textContent = effectiveDate;
    }

    const metaDescriptionEl = document.querySelector('meta[name="description"]');
    if (metaDescriptionEl) {
      metaDescriptionEl.setAttribute(
        "content",
        `Tra cứu thời khóa biểu (TKB) Trường THPT Chuyên Lý Tự Trọng, Cần Thơ. Áp dụng từ ${effectiveDate}.`
      );
    }
  </script>
  <script type="module" src="/js/utils.js?v=__ASSET_VERSION__"></script>
  <script type="module" src="/js/app.js?v=__ASSET_VERSION__"></script>
